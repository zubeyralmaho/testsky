# Copy to ~/.testsky/models.yaml. Read by the runner, never by the control
# plane: a customer's API key that reaches somebody else's database is a
# liability nobody can insure.
#
# Check it with: testsky doctor --samples 5

# Refuses a host that is not one of the endpoints below. testsky calls no other
# host anyway, so this does not keep screens on the machine: for that, make
# every endpoint below a local one.
offline: false

tiers:
  # Asked on every cache miss: "where is this element". The cheapest thing a
  # model can be asked, and therefore the one worth running locally.
  ground:
    base_url: http://127.0.0.1:11434/v1        # ollama, vLLM, LM Studio, anything OpenAI-compatible
    model: qwen2.5vl:7b
    # api_key_env: TESTSKY_GROUND_KEY               # named, not written down
    timeout_ms: 30000

  # Judges expectations and decides what to do on an unexpected screen. Asked
  # far less often, and worth a better model.
  reason:
    base_url: https://your-gateway.example.com/v1
    model: your-vision-model
    api_key_env: TESTSKY_REASON_KEY
    price_in_per_m: 0.75
    price_out_per_m: 3.75
    # On OpenRouter (base_url https://openrouter.ai/api/v1) two more settings
    # are sent as written; no other host is sent them:
    # provider: { sort: price }      # keep the model on its cheapest host
    # reasoning: { enabled: true }   # a model that thinks sends back what it thought, and the report shows it

  # Reads the wreckage of a failed run afterwards, never during one.
  triage:
    enabled: false
    base_url: https://your-gateway.example.com/v1
    model: your-reasoning-model
    api_key_env: TESTSKY_TRIAGE_KEY

limits:
  max_usd_per_test: 0.25
  max_usd_per_run: 20.00
